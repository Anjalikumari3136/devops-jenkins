<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Verification</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        <h1>DevOps Automatic Deployment</h1>

        <p>Jenkins, Nginx and Git Setup</p>

        <div class="status">
            <div class="card">
                <h2>Jenkins</h2>
                <p>Running</p>
            </div>

            <div class="card">
                <h2>Nginx</h2>
                <p>Running</p>
            </div>

            <div class="card">
                <h2>Git</h2>
                <p>Configured</p>
            </div>
        </div>

        <p class="message">
            Basic DevOps environment verification successful!
        </p>
    </div>

</body>
</html>
